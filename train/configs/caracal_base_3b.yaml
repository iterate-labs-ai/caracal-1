# Caracal Base 3B continued pretrain config
# Sprint 0 (v0) - Kaggle-only stack

model:
  base: Qwen/Qwen2.5-Coder-3B-Instruct

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 5.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 2048
  packing: true
  bf16: false
  fp16: true
  optim: adamw_8bit
  gradient_checkpointing: true
  save_every: 50
  seed: 42

dataset:
  decontam: true
  blocklist_path: data/decontamination/cve_blocklist.json
  manifest: data/corpus_manifest.yaml
  total_steps_target: 4500
  steps_per_session: 900   # ~12h Kaggle T4 x2 (limite real)

relay:
  sessions:
    - session: 1
      founder: pedro
      kaggle_handle: pedroafonso2
      steps: 900
      input_dataset: null
      output_dataset: pedroafonso2/caracal-base-3b-s01
    - session: 2
      founder: kevin
      kaggle_handle: devknz
      steps: 900
      input_dataset: pedroafonso2/caracal-base-3b-s01
      output_dataset: devknz/caracal-base-3b-s02
    - session: 3
      founder: arthur
      kaggle_handle: arturpn
      steps: 900
      input_dataset: devknz/caracal-base-3b-s02
      output_dataset: arturpn/arturpn  # slug nao-padrao escolhido por Arthur
    - session: 4
      founder: vitor
      kaggle_handle: vitorscrt
      steps: 900
      input_dataset: arturpn/arturpn
      output_dataset: vitorscrt/caracal-base-3b-s04
    - session: 5
      founder: alexandre
      kaggle_handle: aletlucas
      steps: 900
      input_dataset: vitorscrt/caracal-base-3b-s04
      output_dataset: aletlucas/caracal-base-3b-v0
