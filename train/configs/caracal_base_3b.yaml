# Caracal Base 3B continued pretrain config
# Sprint 0 (v0) - Kaggle-only stack

model:
  base: Qwen/Qwen2.5-Coder-3B-Instruct

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 5.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 4096
  packing: true
  bf16: true
  optim: adamw_8bit
  gradient_checkpointing: true
  save_every: 500
  seed: 42

dataset:
  decontam: true
  blocklist_path: data/decontamination/cve_blocklist.json
  manifest: data/corpus_manifest.yaml
  total_steps_target: 25000
  steps_per_session: 5000   # 5h Kaggle T4 = ~5k steps

relay:
  sessions:
    - session: 1
      founder: pedro
      steps: 5000
      input_dataset: null
      output_dataset: caracal-base-3b-s01
    - session: 2
      founder: arthur
      steps: 5000
      input_dataset: caracal-base-3b-s01
      output_dataset: caracal-base-3b-s02
    - session: 3
      founder: vitor
      steps: 5000
      input_dataset: caracal-base-3b-s02
      output_dataset: caracal-base-3b-s03
    - session: 4
      founder: kevin
      steps: 5000
      input_dataset: caracal-base-3b-s03
      output_dataset: caracal-base-3b-s04
    - session: 5
      founder: alexandre
      steps: 5000
      input_dataset: caracal-base-3b-s04
      output_dataset: caracal-base-3b-final
