[project]
name = "caracal"
version = "0.1.0"
description = "Caracal-1, cyber security specialist 3B"
authors = [{name = "Iterate Labs"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# TPU runtime (Kaggle TPU kernels). pip install ".[tpu]" so faz sentido em TPU env.
# torch_xla nao tem wheel pra GPU/CPU - eval scripts detectam via find_spec.
tpu = ["torch_xla>=2.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data", "train", "eval", "harness", "modules", "archive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
